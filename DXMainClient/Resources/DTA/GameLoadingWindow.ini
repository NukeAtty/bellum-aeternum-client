; =============================================================================
; GameLoadingWindow.ini
;
; Themes/positions the single-player "Load Game" window
; (GameLoadingWindow.cs, Name = "GameLoadingWindow"), opened from the main menu's
; "Load Game" button.
;
; Every key is optional; omitted keys keep the value hard-coded in the code.
;
; Common attributes accepted by every control (XNAControl):
;   Location=x,y | Size=w,h | Width=w | Height=h | Visible= | Enabled=
;   DrawOrder=n | UpdateOrder=n | RemapColor=r,g,b | Text=...
; =============================================================================

[INISystem]
BasedOn=GenericWindow.ini


; -----------------------------------------------------------------------------
; The window itself. The code sets Size=600,380 and BackgroundTexture=loadmissionbg.png.
; -----------------------------------------------------------------------------
;[GameLoadingWindow]
;BackgroundTexture=loadmissionbg.png
;DrawMode=Tiled
;DrawBorders=false
;Location=0,0
;Size=600,380


; -----------------------------------------------------------------------------
; Saved-game list. An XNAMultiColumnListBox; its columns (name, date/time) are
; defined in code. Common attributes, FontIndex and LineHeight are supported.
; -----------------------------------------------------------------------------
[lbSaveGameList]
;FontIndex=0
;LineHeight=...
;Location=13,13
;Size=574,317


; -----------------------------------------------------------------------------
; Buttons.
; -----------------------------------------------------------------------------
[btnLaunch]
;IdleTexture=110pxbtn.png
;HoverTexture=110pxbtn_c.png
;Text=Load
;Location=125,345
;Size=110,23

[btnDelete]
;IdleTexture=110pxbtn.png
;HoverTexture=110pxbtn_c.png
;Text=Delete
;Location=245,345
;Size=110,23

[btnCancel]
;IdleTexture=110pxbtn.png
;HoverTexture=110pxbtn_c.png
;Text=Cancel
;Location=365,345
;Size=110,23
