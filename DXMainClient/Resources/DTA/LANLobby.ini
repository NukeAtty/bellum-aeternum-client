; =============================================================================
; LANLobby.ini
;
; Base layout for the LAN lobby (LANLobby.cs, window name "LANLobby").
;
; CnCNetLobby.ini is BasedOn this file, so every shared control below also
; positions the CnCNet lobby (CnCNetLobby.cs, window name "CnCNetLobby").
;
; Every key is optional: a control without an entry (or with a commented-out
; key) keeps the value hard-coded in the C# source. Uncomment a key to override.
;
; Common attributes accepted by every control (XNAControl):
;   Location=x,y | Size=w,h | Width=w | Height=h | X=x | Y=y
;   Visible=true/false | Enabled=true/false | DrawOrder=n | UpdateOrder=n
;   RemapColor=r,g,b | Text=...
;   DistanceFromRightBorder=n | DistanceFromBottomBorder=n
;   FillWidth=n | FillHeight=n
;
; NOTE: XNAWindow (unlike INItializableWindow) does NOT support the $X / $Width /
; getWidth() expression keys - only the attributes listed above are understood.
; =============================================================================

[INISystem]
BasedOn=GenericWindow.ini


; -----------------------------------------------------------------------------
; The window itself. The code sets BackgroundTexture=cncnetlobbybg.png and
; Size=(RenderResolutionX-64, RenderResolutionY-64). Because no [LANLobby]
; section is defined, the window falls back to the inherited [GenericWindow]
; block (MainMenu/dbak.png, DrawMode=Centered, DrawBorders=false).
; -----------------------------------------------------------------------------
;[LANLobby]
;BackgroundTexture=cncnetlobbybg.png
;DrawMode=Centered
;DrawBorders=false
;Location=0,0
;Size=...,...


; =============================================================================
; Buttons
; =============================================================================

; -----------------------------------------------------------------------------
; "Create Game" button. Code default Location=(12, Height-35), Size=(133, 23).
; -----------------------------------------------------------------------------
[btnNewGame]
DistanceFromBottomBorder=12

; -----------------------------------------------------------------------------
; "Join Game" button. Code default Location=(157, Height-35), Size=(133, 23).
; -----------------------------------------------------------------------------
[btnJoinGame]
DistanceFromBottomBorder=12

; -----------------------------------------------------------------------------
; "Main Menu" button (LAN-only; the CnCNet lobby uses btnLogout instead).
; Code default Location=(Width-145, Height-35), Size=(133, 23).
; (DistanceFromRightBorder is the gap to the parent's right edge, so 12 here
;  equals X=Width-145 for the 133px-wide button.)
; -----------------------------------------------------------------------------
[btnMainMenu]
DistanceFromRightBorder=12
DistanceFromBottomBorder=12


; =============================================================================
; Lists and chat
; =============================================================================

; -----------------------------------------------------------------------------
; Hosted game list. Code default Location=(12, 41), Width=278, Height=Height-88.
; GameListBox: PanelBackgroundDrawMode, BackgroundTexture, AllowMultiLineItems.
; -----------------------------------------------------------------------------
[lbGameList]
Location=12,43
FillHeight=45

; -----------------------------------------------------------------------------
; Player list. Code default Location=(Width-202, 41), Width=190, Height=Height-88.
; -----------------------------------------------------------------------------
[lbPlayerList]
Location=0,43
DistanceFromRightBorder=12
FillHeight=45

; -----------------------------------------------------------------------------
; Chat message list. Code default Location=(302, 41), Width=Width-516, Height=Height-88.
; -----------------------------------------------------------------------------
[lbChatMessages]
Location=300,43
FillWidth=212
FillHeight=45

; -----------------------------------------------------------------------------
; Chat input box. Code default Location=(302, Height-35), Width=Width-516, Height=23.
; Suggestion="Type here to chat...", MaximumTextLength=200.
; -----------------------------------------------------------------------------
[tbChatInput]
DistanceFromBottomBorder=12
FillWidth=212


; =============================================================================
; Chat color selector
; =============================================================================

; -----------------------------------------------------------------------------
; "YOUR COLOR:" label. Code default Location=(302, 14), FontIndex=1.
; -----------------------------------------------------------------------------
[lblColor]
Location=300,14

; -----------------------------------------------------------------------------
; Chat color drop-down. Code default Location=(397, 12), Size=(150, 21).
; -----------------------------------------------------------------------------
[ddColor]
;Location=395,12
;Size=150,21


; =============================================================================
; CnCNet-only controls that are (for historical reasons) still positioned here.
; They have no effect on the plain LAN lobby and are only used by the CnCNet
; lobby which inherits this file.
; =============================================================================

; -----------------------------------------------------------------------------
; "CURRENT CHANNEL:" label (CnCNet). Code default Location=(Width-564, 14),
; FontIndex=1.
; -----------------------------------------------------------------------------
[lblCurrentChannel]
DistanceFromRightBorder=431

; -----------------------------------------------------------------------------
; Current channel drop-down (CnCNet). Code default Location=(Width-414, 12),
; Size=(200, 21).
; -----------------------------------------------------------------------------
[ddCurrentChannel]
DistanceFromRightBorder=212

; -----------------------------------------------------------------------------
; "Log Out" / "Main Menu" / "Game Lobby" button (CnCNet). Code default
; Location=(Width-145, Height-29), Size=(133, 23). The text is set by the code.
; -----------------------------------------------------------------------------
[btnLogout]
DistanceFromRightBorder=12
DistanceFromBottomBorder=12


; =============================================================================
; Extra controls (created from INI only). These are added to BOTH the LAN and
; CnCNet lobbies because CnCNetLobby.ini inherits this file.
; =============================================================================

[ExtraControls]
L1=btnModDB:XNALinkButton
L2=btnForums:XNALinkButton

[btnModDB]
IdleTexture=moddbInactive.png
HoverTexture=moddbActive.png
URL=http://www.moddb.com/mods/tiberian-sun-client
Size=21,21
Location=0,12
DistanceFromRightBorder=180
DrawOrder=1

[btnForums]
IdleTexture=forumsInactive.png
HoverTexture=forumsActive.png
URL=https://ppmforums.com/index.php?f=24
Size=21,21
Location=0,12
DistanceFromRightBorder=159
DrawOrder=1
