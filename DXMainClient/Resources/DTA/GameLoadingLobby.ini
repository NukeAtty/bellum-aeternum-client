; =============================================================================
; GameLoadingLobby.ini
;
; Themes/positions the multiplayer "Load Game" lobby
; (GameLoadingLobbyBase.cs, Name = "GameLoadingLobby").
;
; It is read by both the CnCNet version (CnCNetGameLoadingLobby) and the LAN
; version (LANGameLoadingLobby) - neither overrides the window name.
;
; Every key is optional; omitted keys keep the value hard-coded in the code.
;
; Common attributes accepted by every control (XNAControl):
;   Location=x,y | Size=w,h | Width=w | Height=h | Visible= | Enabled=
;   DrawOrder=n | UpdateOrder=n | RemapColor=r,g,b | Text=...
; =============================================================================

[INISystem]
BasedOn=GenericWindow.ini


; -----------------------------------------------------------------------------
; The window itself. The code sets Size=590,510 and BackgroundTexture=loadmpsavebg.png.
; -----------------------------------------------------------------------------
;[GameLoadingLobby]
;BackgroundTexture=loadmpsavebg.png
;DrawMode=Tiled
;DrawBorders=false
;Location=0,0
;Size=590,510


; -----------------------------------------------------------------------------
; "Wait for all players to join..." hint label.
; Supported: Text, FontIndex, TextColor/RemapColor, TextShadowDistance,
;            AnchorPoint, TextAnchor, Location, Size.
; -----------------------------------------------------------------------------
[lblDescription]
;Text=...
;FontIndex=0
;Location=12,12


; -----------------------------------------------------------------------------
; The player list panel. NOTE: this panel has no Name in the code, so it cannot
; be targeted with an INI section; only its child labels below are configurable.
; (panelPlayers: Location=12,32 Size=373,125)
; -----------------------------------------------------------------------------


; -----------------------------------------------------------------------------
; Player name labels (labels inside panelPlayers). Names: lblPlayerName0 .. lblPlayerName7.
; Left column at X=9, right column at X=190; rows every 30px.
; -----------------------------------------------------------------------------
[lblPlayerName0]
;Location=9,9
[lblPlayerName1]
;Location=9,39
[lblPlayerName2]
;Location=9,69
[lblPlayerName3]
;Location=9,99
[lblPlayerName4]
;Location=190,9
[lblPlayerName5]
;Location=190,39
[lblPlayerName6]
;Location=190,69
[lblPlayerName7]
;Location=190,99


; -----------------------------------------------------------------------------
; Map / game mode / saved game captions and values.
; -----------------------------------------------------------------------------
[lblMapName]
;Text=MAP:
;FontIndex=1
;Location=397,32

[lblMapNameValue]
;Text=Map name
;Location=397,50

[lblGameMode]
;Text=GAME MODE:
;FontIndex=1
;Location=397,72

[lblGameModeValue]
;Text=Game mode
;Location=397,90

[lblSavedGameTime]
;Text=SAVED GAME:
;FontIndex=1
;Location=397,117


; -----------------------------------------------------------------------------
; Saved-game selector drop-down.
; Supported: FontIndex, ItemHeight, colors, DropDownTexture, OpenUp, ToolTip,
;            Option0..OptionN, Location, Size.
; -----------------------------------------------------------------------------
[ddSavedGame]
;FontIndex=0
;Location=397,136
;Size=181,21


; -----------------------------------------------------------------------------
; Chat list box and chat input.
; -----------------------------------------------------------------------------
[lbChatMessages]
;Location=12,169
;Size=566,286

[tbChatInput]
;Location=12,458
;Size=566,19
;MaximumTextLength=200


; -----------------------------------------------------------------------------
; Buttons.
; -----------------------------------------------------------------------------
[btnLoadGame]
;IdleTexture=133pxbtn.png
;HoverTexture=133pxbtn_c.png
;Text=Load Game
;Location=12,483
;Size=133,23

[btnLeaveGame]
;IdleTexture=133pxbtn.png
;HoverTexture=133pxbtn_c.png
;Text=Leave Game
;Location=445,483
;Size=133,23


; -----------------------------------------------------------------------------
; NOTE: CnCNetGameLoadingLobby also creates "btnChangeTunnel", but it does so
; AFTER base.Initialize() has already parsed the INI, so a [btnChangeTunnel]
; section here has no effect.
; -----------------------------------------------------------------------------
