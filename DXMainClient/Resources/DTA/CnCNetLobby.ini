; =============================================================================
; CnCNetLobby.ini
;
; Layout for the CnCNet lobby (CnCNetLobby.cs, window name "CnCNetLobby").
;
; This file is BasedOn LANLobby.ini, so it inherits the common window frame,
; buttons, lists, chat and chat-color controls from there. Only the controls
; that are unique to the CnCNet lobby are documented in this file; the shared
; ones can be overridden by adding a section here (or by editing LANLobby.ini).
;
; Every key is optional: a control without an entry (or with a commented-out
; key) keeps the value hard-coded in the C# source. Uncomment a key to override.
;
; Common attributes accepted by every control (XNAControl):
;   Location=x,y | Size=w,h | Width=w | Height=h | X=x | Y=y
;   Visible=true/false | Enabled=true/false | DrawOrder=n | UpdateOrder=n
;   RemapColor=r,g,b | Text=...
;   DistanceFromRightBorder=n | DistanceFromBottomBorder=n
;   FillWidth=n | FillHeight=n
;
; NOTE: XNAWindow (unlike INItializableWindow) does NOT support the $X / $Width /
; getWidth() expression keys - only the attributes listed above are understood.
; =============================================================================

[INISystem]
BasedOn=LANLobby.ini


; -----------------------------------------------------------------------------
; The window itself. The code sets BackgroundTexture=cncnetlobbybg.png and
; Size=(RenderResolutionX-64, RenderResolutionY-64). Because no [CnCNetLobby]
; (and no [LANLobby]) section is defined, the window falls back to the inherited
; [GenericWindow] block (MainMenu/dbak.png, DrawMode=Centered, DrawBorders=false).
; -----------------------------------------------------------------------------
;[CnCNetLobby]
;BackgroundTexture=cncnetlobbybg.png
;DrawMode=Centered
;DrawBorders=false
;Location=0,0
;Size=...,...


; =============================================================================
; Inherited / shared controls (defined in LANLobby.ini so they apply to both
; lobbies). Add a section with the same name here to override it for CnCNet only:
;   btnNewGame, btnJoinGame, lbGameList, lbPlayerList, lbChatMessages,
;   tbChatInput, lblColor, ddColor,
;   and the CnCNet-only lblCurrentChannel, ddCurrentChannel, btnLogout that are
;   (for historical reasons) still positioned in LANLobby.ini.
; =============================================================================


; =============================================================================
; CnCNet-only controls
; =============================================================================

; -----------------------------------------------------------------------------
; "Online:" label. Code default Location=(310, 14), FontIndex=1. Starts disabled.
; -----------------------------------------------------------------------------
;[lblOnline]
;Text=Online:
;FontIndex=1
;Location=310,14

; -----------------------------------------------------------------------------
; Online player count label (placed next to lblOnline). Code default
; Location=(360, 14), FontIndex=1. Starts disabled.
; -----------------------------------------------------------------------------
;[lblOnlineCount]
;FontIndex=1
;Location=360,14

; -----------------------------------------------------------------------------
; Game search / filter text box. Code default Location=(12, 12),
; Size=(216, 21). Suggestion="Filter by name, map, game mode, player...",
; MaximumTextLength=64. Starts disabled.
; -----------------------------------------------------------------------------
;[tbGameSearch]
;Suggestion=Filter by name, map, game mode, player...
;MaximumTextLength=64
;Location=12,12
;Size=216,21

; -----------------------------------------------------------------------------
; Alphabetical sort toggle button (XNAClientStateButton<SortDirection>).
; Code default Location=(238, 12), Size=(21, 21). Its textures come from the code.
; -----------------------------------------------------------------------------
;[btnGameSortAlpha]
;Location=238,12
;Size=21,21

; -----------------------------------------------------------------------------
; Game filters toggle button (XNAClientToggleButton). Code default
; Location=(269, 12), Size=(21, 21). Its textures come from the code.
; -----------------------------------------------------------------------------
;[btnGameFilterOptions]
;Location=269,12
;Size=21,21


; =============================================================================
; Game Filters overlay (GameFiltersPanel.cs, control name "GameFiltersWindow").
;
; This panel is a CHILD of the CnCNet lobby window, so its controls are
; configured here in CnCNetLobby.ini (there is no GameFiltersWindow.ini).
; The panel is resized to the game-list area by the code, so the positions
; below are relative to that rectangle. Uncomment a key to override it.
; =============================================================================

;[GameFiltersWindow]
;SolidColorBackgroundTexture=0,0,0,255
;DrawBorders=false

;[FiltersScrollPanel]
;SolidColorBackgroundTexture=0,0,0,200
;DrawBorders=false

;[BottomButtonPanel]
;SolidColorBackgroundTexture=0,0,0,255
;DrawBorders=false

;[lblTitle]
;Text=Game Filters
;FontIndex=0
;Location=12,12
;Size=120,23

;[chkBoxFriendsOnly]
;Text=Show Friend Games Only
;Location=12,47

;[chkBoxHideLockedGames]
;Text=Hide Locked Games
;Location=12,82

;[chkBoxHidePasswordedGames]
;Text=Hide Passworded Games
;Location=12,117

;[chkBoxHideIncompatibleGames]
;Text=Hide Incompatible Games
;Location=12,152

;[ddMaxPlayerCount]
