[INISystem]
BasedOn=LANLobby.ini


; =============================================================================
; Game Filters overlay (GameFiltersPanel.cs, control name "GameFiltersWindow").
;
; This panel is a CHILD of the CnCNet lobby window, so its controls are
; configured here in CnCNetLobby.ini (there is no GameFiltersWindow.ini).
; The panel is resized to the game-list area by the code, so the positions
; below are relative to that rectangle. Uncomment a key to override it.
; =============================================================================

