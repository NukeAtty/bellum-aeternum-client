; =============================================================================
; CnCNetLoginWindow.ini
;
; Theme/position the controls of the "CONNECT TO CNCNET" login window
; (CnCNetLoginWindow.cs). Every key below is optional: if it is not set, the
; value hard-coded in CnCNetLoginWindow.cs is used.
;
; The window inherits GenericWindow.ini so it keeps the generic window frame
; and background behaviour. Uncomment a key to override it.
;
; Common attributes accepted by every control (XNAControl):
;   Location=x,y | Size=w,h | Width=w | Height=h | X=x | Y=y
;   Visible=true/false | Enabled=true/false | DrawOrder=n | UpdateOrder=n
;   RemapColor=r,g,b | Text=...
; =============================================================================

[INISystem]
BasedOn=GenericWindow.ini


; -----------------------------------------------------------------------------
; The window itself.
; NOTE: creating (uncommenting) this section disables the [GenericWindow]
; fallback for the window frame/background, so the values below then apply
; instead of the inherited ones.
; -----------------------------------------------------------------------------
;[CnCNetLoginWindow]
;Location=0,0
;Size=300,220
;BackgroundTexture=logindialogbg.png
;DrawMode=Centered
;DrawBorders=false


; -----------------------------------------------------------------------------
; "CONNECT TO CNCNET" title label.
; Supported: Text, FontIndex, TextColor/RemapColor, TextShadowDistance,
;            AnchorPoint, TextAnchor.
; By default the label is centered horizontally and placed at Y=12.
; -----------------------------------------------------------------------------
[lblConnectToCnCNet]
;Text=CONNECT TO CNCNET
;FontIndex=1
;TextColor=45,228,255
;Location=...,12


; -----------------------------------------------------------------------------
; Player name text box.
; Supported: Text, MaximumTextLength, Location, Size.
; -----------------------------------------------------------------------------
[tbPlayerName]
;Location=168,50
;Size=120,19
;Text=
;MaximumTextLength=16


; -----------------------------------------------------------------------------
; "PLAYER NAME:" label.
; Supported: Text, FontIndex, TextColor/RemapColor, TextShadowDistance,
;            AnchorPoint, TextAnchor.
; -----------------------------------------------------------------------------
[lblPlayerName]
;Text=PLAYER NAME:
;FontIndex=1
;TextColor=45,228,255
;Location=12,51


; -----------------------------------------------------------------------------
; Check boxes.
; Supported: Text, FontIndex, IdleColor, HighlightColor, AlphaRate,
;            AllowChecking, Checked, TextPadding, ToolTip.
; The three check boxes are stacked automatically by the code; setting
; Location overrides that.
; -----------------------------------------------------------------------------
[chkRememberMe]
;Text=Remember me
;TextPadding=7
;IdleColor=45,228,255
;HighlightColor=255,255,255
;Location=12,81

[chkPersistentMode]
;Text=Stay connected outside of the CnCNet lobby
;TextPadding=7
;IdleColor=45,228,255
;HighlightColor=255,255,255

[chkAutoConnect]
;Text=Connect automatically on client startup
;TextPadding=7
;AllowChecking=false
;IdleColor=45,228,255
;HighlightColor=255,255,255


; -----------------------------------------------------------------------------
; Buttons.
; Supported: IdleTexture, HoverTexture, HoverSoundEffect, ClickSoundEffect,
;            TextColorIdle, TextColorHover, FontIndex, Text, AdaptiveText,
;            AlphaRate, TextShadowDistance, MatchTextureSize, ToolTip.
; -----------------------------------------------------------------------------
[btnConnect]
;IdleTexture=110pxbtn.png
;HoverTexture=110pxbtn_c.png
;Text=Connect
;Location=12,185
;Size=110,23

[btnCancel]
;IdleTexture=110pxbtn.png
;HoverTexture=110pxbtn_c.png
;Text=Cancel
;DistanceFromRightBorder=12
