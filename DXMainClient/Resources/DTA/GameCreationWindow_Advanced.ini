; =============================================================================
; GameCreationWindow_Advanced.ini
;
; Themed separately because GameCreationWindow renames itself to
; "GameCreationWindow_Advanced" when the user opens "Advanced Options"
; (GameCreationWindow.cs:304) and then reads this file.
;
; It is based on GameCreationWindow.ini so all the control sections defined
; there (tbGameName, ddMaxPlayers, btnCreateGame, ...) also apply in the
; advanced view. Add a [GameCreationWindow_Advanced] section below to give the
; advanced window a different frame/background than the normal one.
; =============================================================================

[INISystem]
BasedOn=GameCreationWindow.ini


; -----------------------------------------------------------------------------
; The advanced window itself.
; If this section is not present, the window falls back to the inherited
; [GameCreationWindow_Advanced] / [GenericWindow] section.
; -----------------------------------------------------------------------------
;[GameCreationWindow_Advanced]
;BackgroundTexture=gamecreationoptionsbg.png
;DrawMode=Tiled
;DrawBorders=false
;Location=0,0
;Size=490,205


; -----------------------------------------------------------------------------
; Buttons in the advanced view.
;
; GameCreationWindow.cs repositions the buttons below the tunnel list and grows
; the window BEFORE calling SetAttributesFromIni() again, so this file is read
; last and these values win. IdleTexture / HoverTexture / Text / Size are
; inherited from GameCreationWindow.ini; only the position needs overriding.
;
; Anchoring to the bottom (and right) reproduces the code's advanced layout
; regardless of the tunnel list's height. Use Location=x,y instead if you want
; absolute coordinates.
;
; NOTE: without these overrides the inherited normal-mode Location would apply
; and the buttons would NOT move down as the code intends.
; -----------------------------------------------------------------------------
[btnCreateGame]
X=12
DistanceFromBottomBorder=12

[btnLoadMPGame]
X=179
DistanceFromBottomBorder=12

[btnCancel]
DistanceFromRightBorder=12
DistanceFromBottomBorder=12
