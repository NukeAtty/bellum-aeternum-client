; =============================================================================
; GameCreationWindow.ini
;
; Theme/position the CnCNet "Create Game" (host room) window
; (GameCreationWindow.cs). Every key below is optional: if it is not set, the
; value hard-coded in GameCreationWindow.cs is used.
;
; This window inherits GenericWindow.ini (via [INISystem] BasedOn), so it keeps
; the generic frame/background fallback. Uncomment a key to override it.
;
; NOTE: the "Advanced Options" view uses a different window name
; (GameCreationWindow_Advanced) and is themed by GameCreationWindow_Advanced.ini.
;
; Common attributes accepted by every control (XNAControl):
;   Location=x,y | Size=w,h | Width=w | Height=h | X=x | Y=y
;   Visible=true/false | Enabled=true/false | DrawOrder=n | UpdateOrder=n
;   RemapColor=r,g,b | Text=...
; =============================================================================

[INISystem]
BasedOn=GenericWindow.ini


; -----------------------------------------------------------------------------
; The window itself.
; NOTE: creating (uncommenting) this section disables the [GenericWindow] /
; [GameCreationWindow] fallback for the window frame, so the values below then
; apply instead of the inherited ones.
; -----------------------------------------------------------------------------
;[GameCreationWindow]
;BackgroundTexture=gamecreationoptionsbg.png
;DrawMode=Tiled
;DrawBorders=false
;Location=0,0
;Size=490,205


; -----------------------------------------------------------------------------
; Game name text box.
; Supported: Text, MaximumTextLength, Location, Size.
; -----------------------------------------------------------------------------
[tbGameName]
;Text=My Game
;MaximumTextLength=23
;Location=...,...
;Size=150,21


; -----------------------------------------------------------------------------
; "Game room name:" label.
; Supported: Text, FontIndex, TextColor/RemapColor, TextShadowDistance,
;            AnchorPoint, TextAnchor, Location, Size.
; -----------------------------------------------------------------------------
[lblRoomName]
;Text=Game room name:
;FontIndex=0
;Location=...,...


; -----------------------------------------------------------------------------
; Max players drop-down.
; Supported: FontIndex, ItemHeight, TextColor, BorderColor, FocusColor,
;            BackColor, DisabledItemColor, DropDownTexture, DropDownOpenTexture,
;            OpenUp, ShowEllipsisOnOverflow, ClickSoundEffect, ToolTip,
;            Option0..OptionN (adds items), Location, Size.
; -----------------------------------------------------------------------------
[ddMaxPlayers]
;FontIndex=0
;ItemHeight=...
;Location=...,...
;Size=150,21


; -----------------------------------------------------------------------------
; "Maximum number of players:" label.
; -----------------------------------------------------------------------------
[lblMaxPlayers]
;Text=Maximum number of players:
;FontIndex=0
;Location=...,...


; -----------------------------------------------------------------------------
; Preferred skill level drop-down.
; -----------------------------------------------------------------------------
[ddSkillLevel]
;FontIndex=0
;ItemHeight=...
;Location=...,...
;Size=150,21


; -----------------------------------------------------------------------------
; "Select preferred skill level of players:" label.
; -----------------------------------------------------------------------------
[lblSkillLevel]
;Text=Select preferred skill level of players:
;FontIndex=0
;Location=...,...


; -----------------------------------------------------------------------------
; Password text box.
; Supported: Text, MaximumTextLength, Location, Size.
; -----------------------------------------------------------------------------
[tbPassword]
;MaximumTextLength=20
;Location=...,...
;Size=150,21


; -----------------------------------------------------------------------------
; "Password (leave blank for none):" label.
; -----------------------------------------------------------------------------
[lblPassword]
;Text=Password (leave blank for none):
;FontIndex=0
;Location=...,...


; -----------------------------------------------------------------------------
; "Advanced Options" button.
; Supported: IdleTexture, HoverTexture, HoverSoundEffect, ClickSoundEffect,
;            Text, TextColorIdle, TextColorHover, FontIndex, AlphaRate,
;            AdaptiveText, MatchTextureSize, ToolTip, Location, Size.
; -----------------------------------------------------------------------------
[btnDisplayAdvancedOptions]
;Text=Advanced Options
;Location=...,...
;Size=133,23


; -----------------------------------------------------------------------------
; "Tunnel mode:" label (advanced view).
; -----------------------------------------------------------------------------
[lblTunnelServer]
;Text=Tunnel mode:
;FontIndex=0
;Location=...,...


; -----------------------------------------------------------------------------
; Tunnel mode drop-down (advanced view).
; Supported: same as the other drop-downs.
; -----------------------------------------------------------------------------
[ddTunnelMode]
;FontIndex=0
;Location=...,...
;Size=220,23


; -----------------------------------------------------------------------------
; Tunnel list (advanced view).
; An XNAMultiColumnListBox; its columns are defined in code. Common attributes
; and FontIndex can be set here.
; -----------------------------------------------------------------------------
[lbTunnelList]
;FontIndex=0
;Location=...,...
;Size=...,...


; -----------------------------------------------------------------------------
; Dimming overlay drawn over the tunnel list when a tunnel is not needed.
; An XNAPanel: BackgroundTexture, SolidColorBackgroundTexture, DrawMode,
; DrawBorders, BorderColor, AlphaRate, Padding + common attributes.
; -----------------------------------------------------------------------------
[pnlTunnelListDisabledOverlay]
;SolidColorBackgroundTexture=0,0,0,128
;DrawBorders=false


; -----------------------------------------------------------------------------
; Buttons.
; -----------------------------------------------------------------------------
[btnCreateGame]
;IdleTexture=133pxbtn.png
;HoverTexture=133pxbtn_c.png
;Text=Create Game
;Location=...,...
;Size=133,23

[btnLoadMPGame]
;IdleTexture=133pxbtn.png
;HoverTexture=133pxbtn_c.png
;Text=Load Game
;Location=...,...
;Size=133,23

[btnCancel]
;IdleTexture=133pxbtn.png
;HoverTexture=133pxbtn_c.png
;Text=Cancel
;Location=...,...
;Size=133,23
